{% extends "index.html" %}

{% block page_title %}Sales Recording{% endblock %}

{% block content %}
<div class="form-card">
    <h3 style="margin-bottom: 16px;">Record Sale</h3>
    <form id="saleForm" class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="form-group">
            <label for="product_id">Product</label>
            <select id="product_id" class="form-control" required>
                <!-- populated via js -->
            </select>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" class="form-control" required min="1">
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" class="form-control" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Record Sale</button>
        </div>
    </form>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total Price</th>
            </tr>
        </thead>
        <tbody id="salesTable">
            <!-- populated via js -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("saleForm");
        const tbody = document.getElementById("salesTable");
        const select = document.getElementById("product_id");

        // Set today's date default
        document.getElementById("date").valueAsDate = new Date();

        // Load Products into dropdown
        const products = await api.get('/api/products');
        if (products.length === 0) {
            select.innerHTML = '<option value="" disabled selected>No products available</option>';
        } else {
            products.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.textContent = `${p.name} ($${p.price})`;
                select.appendChild(opt);
            });
        }

        async function loadSales() {
            const data = await api.get('/api/sales');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No sales recorded yet.</td></tr>';
                return;
            }
            data.forEach(s => {
                const tr = document.createElement("tr");
                const dateObj = new Date(s.date);
                // add timezone offset workaround
                dateObj.setMinutes(dateObj.getMinutes() + dateObj.getTimezoneOffset());
                const dateSplit = dateObj.toLocaleDateString();
                
                tr.innerHTML = `
                    <td>#${s.id}</td>
                    <td>${dateSplit}</td>
                    <td style="font-weight: 500;">${s.product_name}</td>
                    <td>${s.quantity}</td>
                    <td style="color: var(--success); font-weight: 600;">$${s.total_price.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const product_id = select.value;
            const quantity = document.getElementById("quantity").value;
            const date = document.getElementById("date").value;

            if(!product_id) {
                alert("Please add a product first!");
                return;
            }

            const res = await api.post('/api/sales', { product_id, quantity, date });
            if (res) {
                loadSales();
                document.getElementById("quantity").value = "";
            }
        });

        loadSales();
    });
</script>
{% endblock %}
