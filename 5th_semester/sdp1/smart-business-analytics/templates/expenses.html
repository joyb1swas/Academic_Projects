{% extends "index.html" %}

{% block page_title %}Expense Recording{% endblock %}

{% block content %}
<div class="form-card">
    <h3 style="margin-bottom: 16px;">Record Expense</h3>
    <form id="expenseForm" class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" class="form-control" placeholder="e.g. Rent, Marketing" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" step="0.01" id="amount" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" class="form-control" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Record Expense</button>
        </div>
    </form>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="expensesTable">
            <!-- populated via js -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("expenseForm");
        const tbody = document.getElementById("expensesTable");

        // Set today's date default
        document.getElementById("date").valueAsDate = new Date();

        async function loadExpenses() {
            const data = await api.get('/api/expenses');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No expenses recorded yet.</td></tr>';
                return;
            }
            data.forEach(e => {
                const tr = document.createElement("tr");
                const dateObj = new Date(e.date);
                dateObj.setMinutes(dateObj.getMinutes() + dateObj.getTimezoneOffset());
                const dateSplit = dateObj.toLocaleDateString();

                tr.innerHTML = `
                    <td>#${e.id}</td>
                    <td>${dateSplit}</td>
                    <td style="font-weight: 500;">${e.category}</td>
                    <td style="color: var(--danger); font-weight: 600;">$${e.amount.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const category = document.getElementById("category").value;
            const amount = document.getElementById("amount").value;
            const date = document.getElementById("date").value;

            const res = await api.post('/api/expenses', { category, amount, date });
            if (res) {
                document.getElementById("category").value = "";
                document.getElementById("amount").value = "";
                loadExpenses();
            }
        });

        loadExpenses();
    });
</script>
{% endblock %}
