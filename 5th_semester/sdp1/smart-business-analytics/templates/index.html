<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Business Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>Smart Analytics</h2>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/products" class="nav-link {% if request.path == '/products' %}active{% endif %}">Products</a>
                <a href="/sales" class="nav-link {% if request.path == '/sales' %}active{% endif %}">Sales</a>
                <a href="/expenses" class="nav-link {% if request.path == '/expenses' %}active{% endif %}">Expenses</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="top-header">
                <h1>{% block page_title %}{% endblock %}</h1>
            </header>
            
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
